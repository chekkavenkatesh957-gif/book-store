<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Book</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}
.container{
    width:450px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{
    text-align:center;
    color:#0d6efd;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#0b5ed7;
}
a{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
<h2>Edit Book</h2>

<form id="editBookForm">

<input type="text" id="title" placeholder="Book Title" required>

<input type="text" id="author" placeholder="Author" required>

<input type="number" id="price" placeholder="Price" required>

<input type="text" id="category" placeholder="Category" required>

<input type="text" id="image" placeholder="Book Image Filename or URL (e.g. java.jpg)">

<button type="submit">Update Book</button>

</form>

<a href="/manage-book">⬅️ Back to Manage Books</a>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadBookDetails() {
    if (!id) return;
    try {
        const res = await fetch("/api/books");
        const books = await res.json();
        const book = books.find(b => (b._id === id || b.id === id));
        if (book) {
            document.getElementById("title").value = book.title || "";
            document.getElementById("author").value = book.author || "";
            document.getElementById("price").value = book.price || "";
            document.getElementById("category").value = book.category || "";
            document.getElementById("image").value = book.image || "";
        }
    } catch (e) {
        console.error("Failed to load book details", e);
    }
}

document.addEventListener("DOMContentLoaded", loadBookDetails);

document.getElementById("editBookForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const book = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        price: document.getElementById("price").value,
        category: document.getElementById("category").value,
        image: document.getElementById("image").value
    };

    const res = await fetch("/api/books/" + id, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(book)
    });

    if(res.ok){
        alert("Book updated successfully");
        window.location.href="/manage-book";
    }else{
        alert("Failed to update book");
    }
});
</script>

</body>
</html>
