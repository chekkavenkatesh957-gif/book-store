<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Online Book Store</title>
<meta name="description" content="Login to your Online Book Store account and explore thousands of books.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ── Auth page layout ── */
body { min-height: 100vh; display: flex; flex-direction: column; background: #060e1f; }

.auth-bg {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(37,99,235,0.18) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.15) 0%, transparent 55%),
                radial-gradient(ellipse at 60% 80%, rgba(16,185,129,0.10) 0%, transparent 50%),
                linear-gradient(135deg, #060e1f 0%, #0f172a 50%, #0d1b3e 100%);
    overflow: hidden;
}

.auth-bg::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
}

@keyframes gridMove { from { transform: translateY(0); } to { transform: translateY(40px); } }

.floating-orb {
    position: absolute; border-radius: 50%; filter: blur(80px); animation: floatOrb 10s ease-in-out infinite alternate;
}
.orb1 { width: 320px; height: 320px; background: rgba(37,99,235,0.25); top: -80px; left: -80px; animation-delay: 0s; }
.orb2 { width: 250px; height: 250px; background: rgba(139,92,246,0.2); bottom: -60px; right: -60px; animation-delay: -4s; }
.orb3 { width: 180px; height: 180px; background: rgba(16,185,129,0.15); top: 50%; right: 20%; animation-delay: -7s; }

@keyframes floatOrb {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(30px,40px) scale(1.1); }
}

.main-wrapper {
    flex: 1; display: flex; justify-content: center; align-items: center;
    padding: 100px 15px 60px; position: relative; z-index: 1;
}

.auth-card {
    width: 100%; max-width: 440px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
    padding: 44px 40px;
    animation: slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.auth-icon {
    width: 72px; height: 72px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; box-shadow: 0 12px 32px rgba(37,99,235,0.45);
}

.auth-card h2 {
    text-align: center; color: #fff;
    font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px;
}
.auth-card .subtitle {
    text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 32px;
}

/* Input groups */
.field { margin-bottom: 18px; }
.field label {
    display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 8px;
}
.input-wrap { position: relative; }
.input-wrap .i-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 17px; pointer-events: none; opacity: 0.55;
}
.input-wrap input {
    width: 100%; padding: 14px 16px 14px 46px;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px; color: #fff; font-size: 15px; font-family: 'Outfit', sans-serif;
    outline: none; transition: all 0.25s ease; box-sizing: border-box;
}
.input-wrap input::placeholder { color: rgba(255,255,255,0.3); }
.input-wrap input:focus {
    border-color: #3b82f6; background: rgba(59,130,246,0.1);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.18);
}

.pw-toggle {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 18px;
    color: rgba(255,255,255,0.4); padding: 0; line-height: 1;
    transition: color 0.2s;
}
.pw-toggle:hover { color: #3b82f6; }

.btn-auth {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    color: white; border: none; border-radius: 12px; font-size: 16px;
    font-weight: 700; cursor: pointer; font-family: 'Outfit', sans-serif;
    margin-top: 8px;
    box-shadow: 0 8px 24px rgba(37,99,235,0.4);
    transition: all 0.25s ease; letter-spacing: 0.3px;
}
.btn-auth:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(37,99,235,0.55); }
.btn-auth:active { transform: translateY(0); }
.btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.auth-switch {
    text-align: center; margin-top: 24px; font-size: 14px; color: rgba(255,255,255,0.45);
}
.auth-switch a { color: #60a5fa; font-weight: 700; text-decoration: none; transition: color 0.2s; }
.auth-switch a:hover { color: #93c5fd; }

.divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 24px 0; }

footer { background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="auth-bg">
    <div class="floating-orb orb1"></div>
    <div class="floating-orb orb2"></div>
    <div class="floating-orb orb3"></div>
</div>

<header>
    <h1><a href="/">📚 Online Book Store</a></h1>
    <nav>
        <a href="/">🏠 Home</a>
        <a href="/contact">✉️ Contact</a>
        <a href="/cart">🛒 Cart</a>
        <a href="/orders">📦 Orders</a>
        <span id="navAuth">
            <a href="/login" class="active">🔐 Login</a>
            <a href="/signup">🚀 Sign Up</a>
        </span>
    </nav>
</header>

<div class="main-wrapper">
    <div class="auth-card">

        <div class="auth-icon">🔐</div>
        <h2>Welcome Back!</h2>
        <p class="subtitle">Sign in to continue your reading journey</p>

        <form id="loginForm">
            <div class="field">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <span class="i-icon">📧</span>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="i-icon">🔒</span>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" style="padding-right: 48px;">
                    <button type="button" class="pw-toggle" onclick="togglePw('password', this)" title="Show/hide password">👁️</button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn-auth">🔑 Login to Account</button>
        </form>

        <div class="auth-switch">
            Don't have an account? <a href="/signup">Create one free →</a>
        </div>

    </div>
</div>

<footer>
    <p>© 2026 Online Book Store. All Rights Reserved.</p>
</footer>

<script src="/js/auth.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.disabled = true;
    loginBtn.innerHTML = "⏳ Signing in...";

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await safeParseResponse(response);

        if (response.ok) {
            if (data.user) {
                localStorage.setItem("user", JSON.stringify(data.user));
            }
            showToast("✅ Welcome back, " + (data.user ? data.user.name : "") + "!");
            setTimeout(() => { window.location.href = "/"; }, 1200);
        } else {
            showToast(data.message || "Login failed. Please check your credentials.", true);
        }
    } catch(err) {
        showToast(err.message || "Connection error. Please try again.", true);
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = "🔑 Login to Account";
    }
});

function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}

function showToast(message, isError = false) {
    const t = document.createElement('div');
    t.style.cssText = `
        position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px);
        background:${isError ? 'linear-gradient(135deg,#ef4444,#dc2626)' : 'linear-gradient(135deg,#10b981,#059669)'};
        color:#fff; padding:14px 28px; border-radius:14px; font-size:15px; font-weight:600;
        box-shadow:0 8px 32px rgba(0,0,0,0.4); z-index:9999; white-space:nowrap;
        transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1); opacity:0; font-family:'Outfit',sans-serif;
    `;
    t.textContent = message;
    document.body.appendChild(t);
    requestAnimationFrame(() => { t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
    setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(10px)'; setTimeout(()=>t.remove(),350); }, 3000);
}
</script>

</body>
</html>
