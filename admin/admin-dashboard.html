<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Store - Admin Dashboard</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
body{ background:#f4f6f9; }
header{ background:#0d47a1; color:white; padding:20px 30px; display:flex; justify-content:space-between; align-items:center; }
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-top:30px; }
.card{ background:white; padding:25px; border-radius:12px; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,.06); }
.card h2{ color:#0d47a1; margin-bottom:10px; font-size:18px; }
.menu{ margin-top:40px; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; }
.menu a{ background:#1565c0; color:white; text-decoration:none; text-align:center; padding:20px; border-radius:12px; font-size:18px; font-weight:600; }
</style>
</head>
<body>

<header>
    <h1>📚 Book Store Admin Dashboard</h1>
    <a href="/admin/login" style="color:white; background:red; padding:10px 15px; border-radius:5px; text-decoration:none;">Logout</a>
</header>

<div style="width:90%; max-width:1100px; margin:30px auto;">
    <div class="cards">
        <div class="card"><h2>📚 Total Books</h2><h1 id="totalBooks">0</h1></div>
        <div class="card"><h2>👥 Total Users</h2><h1 id="totalUsers">0</h1></div>
        <div class="card"><h2>📦 Total Orders</h2><h1 id="totalOrders">0</h1></div>
        <div class="card"><h2>💰 Total Sales</h2><h1 id="totalSales">₹0</h1></div>
    </div>

    <div class="menu">
        <a href="/admin/add-book">➕ Add Book</a>
        <a href="/admin/manage-book">📚 Manage Books</a>
        <a href="/admin/manage-user">👥 Manage Users</a>
        <a href="/admin/orders">📦 Manage Orders</a>
    </div>
</div>

<script>
async function loadDashboard() {
    try {
        const books = await fetch("/api/books").then(res => res.json()).catch(() => []);
        document.getElementById("totalBooks").innerText = books.length || 0;

        const users = await fetch("/api/users").then(res => res.json()).catch(() => []);
        document.getElementById("totalUsers").innerText = users.length || 0;

        const serverOrders = await fetch("/api/orders").then(res => res.json()).catch(() => []);
        const localOrders = JSON.parse(localStorage.getItem("bookstoreOrderHistory")) || [];
        const orderMap = new Map();
        serverOrders.forEach(o => orderMap.set(o._id || o.id, o));
        localOrders.forEach(o => { if(!orderMap.has(o._id || o.id || o.orderId)) orderMap.set(o._id || o.id || o.orderId, o); });
        
        const allOrders = Array.from(orderMap.values());
        document.getElementById("totalOrders").innerText = allOrders.length;

        const totalSales = allOrders.reduce((sum, order) => {
            const amount = order.totalAmount || order.total || (order.items ? order.items.reduce((s, i) => s + (i.price * (i.quantity || 1)), 0) : 0);
            return sum + (Number(amount) || 0);
        }, 0);

        document.getElementById("totalSales").innerText = `₹${totalSales.toLocaleString('en-IN')}`;
    } catch (err) { console.error(err); }
}
loadDashboard();
</script>
</body>
</html>
