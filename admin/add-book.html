<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Book</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

.container{
    width:500px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#0d47a1;
    margin-bottom:20px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#0d47a1;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

a{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#0d47a1;
}
</style>

</head>

<body>

<div class="container">

<h2>📚 Add New Book</h2>

<form action="/api/books" method="POST">

<input
type="text"
name="title"
placeholder="Book Title"
required>

<input
type="text"
name="author"
placeholder="Author Name"
required>

<input
type="number"
name="price"
placeholder="Price"
required>

<select name="category" required>
<option value="">Select Category</option>
<option>Java</option>
<option>Python</option>
<option>C</option>
<option>C++</option>
<option>JavaScript</option>
<option>Node.js</option>
<option>MongoDB</option>
<option>SQL</option>
<option>Data Structures</option>
<option>Algorithms</option>
</select>

<input
type="text"
name="image"
placeholder="Book Image URL">

<textarea
name="description"
rows="4"
placeholder="Book Description"></textarea>

<button type="submit">
Add Book
</button>

</form>

<a href="/admin-dashboard">⬅️ Back to Dashboard</a>

</div>

</body>
</html>
