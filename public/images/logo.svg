<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <defs>
    <linearGradient id="bookBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bookGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Book Icon (no background box, just the icon) -->
  <g transform="translate(0, 2)">
    <!-- Left page -->
    <path d="M 6 8 Q 24 4 24 16 L 24 42 Q 6 38 6 42 Z"
          fill="white" fill-opacity="0.92"/>
    <!-- Right page -->
    <path d="M 42 8 Q 24 4 24 16 L 24 42 Q 42 38 42 42 Z"
          fill="#93c5fd" fill-opacity="0.85"/>
    <!-- Spine -->
    <line x1="24" y1="5" x2="24" y2="42"
          stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Gold bookmark -->
    <path d="M 24 18 L 29 30 L 24 27 L 19 30 Z"
          fill="url(#bookGold)"/>
  </g>

  <!-- "Venky's" text -->
  <text x="54" y="28"
    font-family="'Outfit', Arial, sans-serif"
    font-size="21" font-weight="900"
    fill="#ffffff"
    letter-spacing="-0.3">Venky's</text>

  <!-- "BookStore" in gold -->
  <text x="133" y="28"
    font-family="'Outfit', Arial, sans-serif"
    font-size="21" font-weight="900"
    fill="#fbbf24"
    letter-spacing="-0.3">BookStore</text>

  <!-- Tagline -->
  <text x="55" y="44"
    font-family="'Outfit', Arial, sans-serif"
    font-size="8.5" font-weight="700"
    fill="rgba(147,197,253,0.85)"
    letter-spacing="2.0">ONLINE READS &amp; COVERS</text>
</svg>
