<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr venky book strore</title>

<link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>

<h1>📚 Online Book Store</h1>

<nav>
<a href="/">Home</a>
<a href="/contact">Contact</a>
<a href="/cart">Cart (<span id="cartCount">0</span>)</a>
<a href="/orders">Order History</a>
<span id="navAuth">
    <a href="/login">Login</a>
    <a href="/signup">Sign Up</a>
</span>
</nav>

</header>

<div class="hero">
<h2>Welcome to Online Book Store</h2>
<p>Buy your favourite books online.</p>
</div>

<div class="container">

<div class="category-section">
    <div class="category-title">🏷️ Browse Categories</div>
    <div id="categoryChips" class="category-chips">
        <button class="category-chip active" onclick="selectCategory('all', this)">📚 All Books</button>
    </div>
</div>

<div id="booksList" class="books"></div>

</div>

<footer>
<p>© 2026 Online Book Store. All Rights Reserved.</p>
</footer>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
